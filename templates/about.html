{% extends "base.html" %}
{% block title %}{{ t.about }} — {{ site.name }}{% endblock %}
{% block main %}
<section class="wrap page-head"><h1>{{ t.about }}</h1></section>
<section class="wrap narrow prose">
  {% for p in about %}<p>{{ p }}</p>{% endfor %}
  <p><a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a></p>
</section>
{% endblock %}
