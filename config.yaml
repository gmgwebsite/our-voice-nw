# ============================================================
#  Our Voice NW — main settings
#  Edit this file to change the site name, sources and behaviour.
# ============================================================

site:
  name: "Our Voice NW"
  # Full public address of the site, no trailing slash.
  # For GitHub Pages this is usually https://<username>.github.io/<repo-name>
  base_url: "https://gmgwebsite.github.io/our-voice-nw"
  tagline:
    ru: "Новости для русско- и украиноязычных жителей Северо-Запада США"
    uk: "Новини для російсько- та україномовних мешканців Північного Заходу США"
  contact_email: "timur@slavicfamily.org"

# ---------- Live radio player ----------
# The player uses TuneIn's official embeddable player.
# tunein_id is the "s12345" code at the end of the station's TuneIn address.
radio:
  enabled: true
  tunein_id: "s55604"
  name: "KXPD 1040 AM"
  frequency: "1040 AM"
  city: "Portland, OR"

# ---------- Daily robot settings ----------
pipeline:
  stories_per_day: 4          # 3–4 recommended
  # true  = new stories go live immediately
  # false = stories are proposed as a GitHub "pull request" you approve with one click
  auto_publish: true
  # Claude model used for selecting and writing. Change to a newer model any time.
  model: "claude-sonnet-5-5"
  max_age_hours: 36           # ignore items older than this
  # Skip a story if we already covered the same source link
  avoid_duplicates: true
  # At most this many stories in the "ukraine" section per 7 days
  ukraine_per_week: 1

# ---------- What the editor (Claude) should look for ----------
editorial_brief: |
  Our readers are Russian- and Ukrainian-speaking immigrants and refugees living in
  Washington, Oregon and Idaho: Ukrainian parolees (U4U / TPS), long-time immigrant
  families from Russia, Ukraine, Belarus, Moldova, Georgia, Armenia, Azerbaijan,
  Kazakhstan, Uzbekistan, Kyrgyzstan, Tajikistan, Turkmenistan and the Baltic states,
  students, workers and small-business owners.
  Focus on AMERICAN news: national US news, federal and state politics, the economy,
  immigration rules, TPS/parole, USCIS and ICE changes, deadlines, local laws, jobs and
  wages, housing, health and social services, schools, safety, weather emergencies and
  community events in the Pacific Northwest.
  Actively look for stories in US media that involve immigrants or communities from the
  former Soviet republics listed above (court cases, deportations, asylum, businesses,
  achievements, community events) — these are especially valuable to our readers.
  News from the war in Ukraine or about Ukraine's government belongs in the "ukraine"
  section, which is strictly limited (see the quota note below). A story about Ukrainians
  living in the US (parole, TPS, local community) is American news, not "ukraine" news.
  Avoid celebrity gossip, crime stories without public-interest value, sports scores,
  tabloid sensationalism, and anything that cannot be verified from the source text.
  Prefer a mix: at least one immigration/legal story and one local Pacific Northwest story.

# ---------- News sources (RSS feeds) ----------
# Add or remove freely. The robot skips any feed that fails, so one broken feed never
# stops the daily run. Run `python scripts/check_feeds.py` to test them all.
sources:
  - name: "Washington State Standard"
    url: "https://washingtonstatestandard.com/feed/"
  - name: "Oregon Capital Chronicle"
    url: "https://oregoncapitalchronicle.com/feed/"
  - name: "Idaho Capital Sun"
    url: "https://idahocapitalsun.com/feed/"
  - name: "The Seattle Times"
    url: "https://www.seattletimes.com/feed/"
  - name: "OPB"
    url: "https://www.opb.org/arc/outboundfeeds/rss/?outputType=xml"
  - name: "The Spokesman-Review"
    url: "https://www.spokesman.com/feeds/stories/"
  - name: "NPR News"
    url: "https://feeds.npr.org/1001/rss.xml"
  - name: "The Guardian — US immigration"
    url: "https://www.theguardian.com/us-news/immigration/rss"
  - name: "New York Post"
    url: "https://nypost.com/news/feed/"
  - name: "New York Post — politics"
    url: "https://nypost.com/politics/feed/"
  - name: "Kyiv Independent"
    url: "https://kyivindependent.com/news-archive/rss/"

